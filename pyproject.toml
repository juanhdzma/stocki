[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "E701",  # compact one-liner guards/ladders are deliberate here; formatter keeps them
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # sys.path hack before imports

[tool.ruff.format]
quote-style = "double"
