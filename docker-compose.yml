services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stockdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocki}
      POSTGRES_DB: stocki
    volumes:
      - stock_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockdesk"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  stocki:
    build: .
    ports:
      - "8503:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://stockdesk:${POSTGRES_PASSWORD:-stocki}@db:5432/stocki
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  stock_data:
