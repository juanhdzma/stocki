name: Build & push to GHCR

on:
  push:
    branches: [master]
    paths:
      - api/**
      - core/**
      - db/**
      - scheduler/**
      - static/**
      - util.py
      - config.py
      - requirements.txt
      - Dockerfile
      - .github/workflows/docker.yml
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/stocki

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # pytest/pytest-asyncio are dev-only, not in requirements.txt (runtime deps only).
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pytest tests/ -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
